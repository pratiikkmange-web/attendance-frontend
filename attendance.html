<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
</head>

<body>

    <h2>Mark Attendance</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Present</th>
                <th>Absent</th>
            </tr>
        </thead>
        <tbody id="studentsTable"></tbody>
    </table>

    <!-- ⭐ Add JavaScript here -->
    <script>
        // Load students from backend
        fetch("https://attendance-backend-production-ea16.up.railway.app/attendance")
            .then(res => res.json())
            .then(data => {
                let html = "";
                data.forEach(s => {
                    html += `
                        <tr>
                            <td>${s.roll}</td>
                            <td>${s.name}</td>
                            <td><button onclick="markAttendance('${s.roll}', 'Present')">Present</button></td>
                            <td><button onclick="markAttendance('${s.roll}', 'Absent')">Absent</button></td>
                        </tr>
                    `;
                });
                document.getElementById("studentsTable").innerHTML = html;
            });

        // Save attendance to backend
        function markAttendance(roll, status) {
            const today = new Date().toISOString().split("T")[0];

            fetch("https://attendance-backend-production-ea16.up.railway.app/attendance"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    roll,
                    status,
                    date: today
                })
            })
            .then(res => res.json())
            .then(data => {
                alert("Attendance saved: " + status);
            });
        }
    </script>

</body>
</html>
