<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>

<body>

    <table border="1">
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody id="studentsTable"></tbody>
    </table>

    <!-- ⭐ Add JavaScript here -->
    <script>
        fetch("https://attendance-backend-production-ea16.up.railway.app/students")ß
            .then(res => res.json())
            .then(data => {
                let html = "";
                data.forEach(s => {
                    html += `
                        <tr>
                            <td>${s.roll}</td>
                            <td>${s.name}</td>
                        </tr>
                    `;
                });
                document.getElementById("studentsTable").innerHTML = html;
            });
    </script>

</body>
</html>
