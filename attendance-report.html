<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>
</head>

<body>

    <h2>Attendance Report</h2>

    <input id="rollInput" placeholder="Enter Roll Number">
    <button onclick="loadReport()">Get Report</button>

    <h3>Summary</h3>
    <p>Present: <span id="presentCount">0</span></p>
    <p>Absent: <span id="absentCount">0</span></p>

    <h3>History</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="historyTable"></tbody>
    </table>

    <!-- ⭐ Add JavaScript here -->
    <script>
        function loadReport() {
            const roll = document.getElementById("rollInput").value;

            fetch(`https://attendance-backend-production-ea16.up.railway.app/attendance-report/${roll}`)
                .then(res => res.json())
                .then(data => {
                    // Update summary
                    document.getElementById("presentCount").innerText = data.present;
                    document.getElementById("absentCount").innerText = data.absent;

                    // Update history table
                    let historyHTML = "";
                    data.history.forEach(r => {
                        historyHTML += `
                            <tr>
                                <td>${r.date}</td>
                                <td>${r.status}</td>
                            </tr>
                        `;
                    });

                    document.getElementById("historyTable").innerHTML = historyHTML;
                });
        }
    </script>

</body>
</html>
